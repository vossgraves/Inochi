[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/db",
    "apps/bot",
    "apps/api",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "SEE LICENSE IN LICENSE"

[workspace.dependencies]
inochi-core = { path = "crates/core" }
inochi-db = { path = "crates/db" }

tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
